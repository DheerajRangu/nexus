services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports: ["8080:80"]
    depends_on: [backend]
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://aegis:${POSTGRES_PASSWORD:-aegis_local}@postgres:5432/aegis
      REDIS_URL: redis://redis:6379/0
      USE_CELERY: "1"
      AEGIS_DEMO_MODE: ${AEGIS_DEMO_MODE:-true}
      AEGIS_OPERATOR_KEY: ${AEGIS_OPERATOR_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes: ["./videos:/app/videos", "./models:/app/models"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: celery -A backend.worker.app worker --loglevel=info --concurrency=1
    environment:
      DATABASE_URL: postgresql+psycopg://aegis:${POSTGRES_PASSWORD:-aegis_local}@postgres:5432/aegis
      REDIS_URL: redis://redis:6379/0
      VEHICLE_MODEL: /app/models/yolo26n.pt
    volumes: ["./videos:/app/videos", "./models:/app/models"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis_local}
      POSTGRES_DB: aegis
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
volumes:
  postgres_data:

version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: aegis-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-aegis} -d $${POSTGRES_DB:-aegis}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aegis-redis
    ports:
      - "6379:6379"

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: aegis-ai-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    depends_on:
      - postgres

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aegis-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local-pg,demo}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aegis}
      DB_USER: ${POSTGRES_USER:-aegis}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      AEGIS_REDIS_ENABLED: ${AEGIS_REDIS_ENABLED:-false}
      AEGIS_ROUTING_PROVIDER: ${AEGIS_ROUTING_PROVIDER:-demo}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      AI_SERVICE_URL: http://ai-service:8000/api/v1
      # Local demo defaults only; set strong values in .env for non-demo deployments.
      JWT_SECRET: ${JWT_SECRET:-aegis-super-secret-controlroom-token-key-32-bytes-min}
      WEBHOOK_HMAC_SECRET: ${WEBHOOK_HMAC_SECRET:-aegis-super-secret-webhook-hmac-key-32-bytes}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aegis-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:

# Native PostgreSQL 16 + PostGIS. Used when Docker is not available.
# Set DB_URL, DB_USER, and DB_PASSWORD in the environment or a gitignored .env.
spring:
  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aegis}}
    username: ${DB_USER:${SPRING_DATASOURCE_USERNAME:aegis}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
